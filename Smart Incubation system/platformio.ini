[env:esp32-s3-wroom1-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; 1. Configure the 16MB Flash Size & Partition Layout
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

; 2. Configure the 8MB PSRAM (Crucial for N16R8 modules)
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi

; 3. Compile flags to enable PSRAM and route serial outputs correctly
build_flags = 
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; 4. Standard serial monitor speed
monitor_speed = 115200
