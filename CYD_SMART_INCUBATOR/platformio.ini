; PlatformIO Project Configuration File — FabNest / JolyFryer cooking controller
; Board: Sunton ESP32-8048S070C (800x480 RGB CYD, capacitive touch, ESP32-S3, 16MB flash + 8MB PSRAM)
;
; Everything this env needs is already in this project:
;   boards/esp32-8048S070C.json   -> board definition (PlatformIO auto-detects project-local "boards/")
;   include/lv_conf.h             -> LVGL 9.2.2 config, enabled + LV_MEM_SIZE bumped to 256K
;   lib/GUI/                      -> your SquareLine export, with the splash-timing patch applied
;   partitions_16mb.csv           -> custom partition table sized for the embedded image assets

[env:esp32-8048S070C]
platform  = espressif32
board     = esp32-8048S070C
framework = arduino

monitor_speed   = 115200
monitor_rts     = 0
monitor_dtr     = 0
monitor_filters = esp32_exception_decoder

board_build.partitions  = partitions_16mb.csv
board_upload.flash_size = 16MB

build_flags =
    -Ofast
    -Wall
    '-D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_INFO'
    ; Force the "simple include" path in LVGL's own lv_conf_internal.h instead of
    ; relying on its __has_include("lv_conf.h") auto-detection, which did not see
    ; our include/lv_conf.h from inside the lvgl library's own source files.
    -D LV_CONF_INCLUDE_SIMPLE
    -Iinclude

; Pulled directly from GitHub main rather than the PlatformIO registry: the last
; published registry release (2.1.1) predates a macro rename (GPIO_BCKL -> DISPLAY_BCKL)
; and an LVGL 9.2.2 API fix that are already in git main and match boards/esp32-8048S070C.json
; (also pulled from git main). Mixing the registry release with the current board defs
; caused "GPIO_BCKL undeclared" / "lv_display_t has no member sw_rotate" build errors.
lib_deps =
    https://github.com/rzeldent/esp32-smartdisplay.git
    lvgl/lvgl@9.2.2
